    <style>

            --muted-ink: #444444;

            margin: 0;
            padding: 0;

            color: var(--text-ink);

            padding: 0.8rem 0.5rem;
            display: flex;
            justify-content: center;

        /* Contenitore ottimizzato per mobile/e-reader */
        .ebook-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--bg-paper);
            border: 2px solid var(--border-ink);
            padding: 1rem 0.8rem;
            border-radius: 3px;
        }

        /* Prima Riga: Titolo + Dropdown Data */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-ink);
            padding-bottom: 0.8rem;
            margin-bottom: 0.8rem;
            gap: 0.5rem;
        }

        .title {
            font-size: 1.15rem;
            font-weight: bold;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }

        .date-select {
            background: var(--bg-paper);
            color: var(--text-ink);
            border: 1.5px solid var(--border-ink);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 0.3rem 0.4rem;
            border-radius: 2px;
            cursor: pointer;
        }

        /* Seconda Riga: Topic Selezionabili (Responsive Grid) */
        .topics-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.4rem;
            border-bottom: 1.5px solid var(--border-ink);
            padding-bottom: 0.8rem;
            margin-bottom: 1rem;
        }

        .topic-btn {
            background: transparent;
            color: var(--text-ink);
            border: 1px solid var(--border-ink);
            padding: 0.5rem 0.2rem;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-radius: 2px;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .topic-btn.active {
            background: var(--active-bg);
            color: var(--active-text);
        }

        /* Elenco Notizie */
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .news-item {
            border-bottom: 1px dashed var(--border-ink);
            padding-bottom: 0.8rem;
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-title {
            font-size: 0.98rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 0.3rem;
        }

        .news-summary {
            font-size: 0.88rem;
            color: var(--muted-ink);
            line-height: 1.35;
            margin-bottom: 0.4rem;
        }

        /* Hyperlink diretto visibile e sottolineato */
        .news-link {
            display: inline-block;
            color: var(--text-ink);
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: underline;
            word-break: break-all;
            line-height: 1.2;
            margin-top: 0.1rem;
        }

        .news-link:active {
            background-color: var(--text-ink);
            color: var(--bg-paper);
        }

        footer {
            margin-top: 1.5rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border-ink);
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted-ink);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>

    let currentDate = "";
    let currentTopic = "Nazionale";

    const dateSelect = document.getElementById('dateSelect');
    const topicsContainer = document.getElementById('topicsContainer');
    const newsContainer = document.getElementById('newsContainer');

    function init() {
        const dates = Object.keys(archive).reverse();
        if (dates.length === 0) return;

        dateSelect.innerHTML = "";
        dates.forEach(date => {
            const opt = document.createElement('option');
            opt.value = date;
            opt.textContent = date;
            dateSelect.appendChild(opt);
        });

        currentDate = dates[0];
        renderTopics();
        renderNews();
    }

    function renderTopics() {
        const topics = Object.keys(archive[currentDate] || {});
        topicsContainer.innerHTML = "";

        topics.forEach(topic => {
            const btn = document.createElement('button');
            btn.className = `topic-btn ${topic === currentTopic ? 'active' : ''}`;
            btn.textContent = topic;
            btn.onclick = () => {
                currentTopic = topic;
                renderTopics();
                renderNews();
            };
            topicsContainer.appendChild(btn);
        });
    }

    function renderNews() {
        newsContainer.innerHTML = "";
        const articles = archive[currentDate]?.[currentTopic] || [];

        articles.forEach((item, index) => {
            const card = document.createElement('article');
            card.className = "news-item";
            
            // Hyperlink diretto visibile
            const displayUrl = item.link;

            card.innerHTML = `
                <div class="news-title">${index + 1}. ${item.title}</div>
                <div class="news-summary">${item.summary}</div>
                <a href="${item.link}" class="news-link" target="_blank" rel="noopener">${displayUrl}</a>
            `;
            newsContainer.appendChild(card);
        });
    }

    function onDateChange() {
        currentDate = dateSelect.value;
        renderTopics();
        renderNews();
    }

    document.addEventListener("DOMContentLoaded", init);
</script>
